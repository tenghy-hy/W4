<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作項目 04：冷媒系統處理</title>
    <style>
        :root { --main: #0984e3; --bg: #f0f2f5; --win: #00b894; --lose: #d63031; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #game-box { background: white; width: 95%; max-width: 450px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        
        /* 計時條樣式 */
        #timer-bg { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin: 15px 0; }
        #timer-fill { width: 100%; height: 100%; background: #ff7675; transition: width 0.1s linear; }
        
        .q-text { font-size: 1.15em; font-weight: bold; margin-bottom: 20px; min-height: 60px; color: #2d3436; text-align: left; line-height: 1.4; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .opt-btn { padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; background: white; cursor: pointer; font-size: 1.05em; text-align: left; outline: none; transition: 0.2s; }
        .correct { background: var(--win) !important; color: white; border-color: var(--win); }
        .wrong { background: var(--lose) !important; color: white; border-color: var(--lose); }
        .hidden { display: none; }
        
        /* 規則區樣式 */
        .rule-box { background: #fff9db; border: 1px solid #ffe066; padding: 12px; border-radius: 10px; text-align: left; font-size: 0.9em; margin-bottom: 20px; color: #665c33; }
        
        select#player-no { width: 100%; padding: 10px; font-size: 1.1em; border-radius: 8px; border: 2px solid var(--main); margin-bottom: 20px; }
        button#start-btn { padding: 12px 35px; font-size: 1.2em; background: var(--main); color: white; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        button#start-btn:disabled { background: #ccc; cursor: not-allowed; }
        #debug-log { background: #222; color: #00ff00; padding: 10px; font-family: monospace; font-size: 11px; text-align: left; margin-top: 20px; border-radius: 5px; max-height: 80px; overflow-y: auto; word-break: break-all; }
    </style>
</head>
<body>

<div id="game-box">
    <div id="start-screen">
        <h2 style="color: var(--main); margin-bottom: 10px;">工作項目 04：冷媒系統處理</h2>
        
        <div class="rule-box">
            <strong>📝 計分規則說明：</strong><br>
            1. 每次測驗將隨機抽取 <strong>10 題</strong>。<br>
            2. 每題作答時間為 <strong>30 秒</strong>。<br>
            3. 答對分數 = 基礎 10 分 + 剩餘秒數獎勵。<br>
            4. 答錯或逾時不給分。
        </div>

        <p>請選擇座號開始測驗：</p>
        <select id="player-no"></select>
        <button id="start-btn" onclick="initGame()" disabled>系統連線中...</button>
        <div id="debug-log">系統狀態：初始化...</div>
    </div>

    <div id="quiz-area" class="hidden">
        <div style="display:flex; justify-content:space-between; font-weight:bold; color:var(--main); font-size: 0.9em;">
            <span id="q-count">0/10</span>
            <span id="score-text">得分: 0</span>
        </div>
        <div id="timer-bg"><div id="timer-fill"></div></div>
        <div id="q-text" class="q-text"></div>
        <div class="options-grid" id="options-area">
            <button class="opt-btn" onclick="handleAnswer(1)"></button>
            <button class="opt-btn" onclick="handleAnswer(2)"></button>
            <button class="opt-btn" onclick="handleAnswer(3)"></button>
            <button class="opt-btn" onclick="handleAnswer(4)"></button>
        </div>
    </div>

    <div id="end-screen" class="hidden">
        <h3>測驗完成</h3>
        <p>工作項目 04：冷媒系統處理</p>
        <h1 id="final-score" style="font-size: 3em; color: var(--main); margin: 10px 0;">0</h1>
        <div id="rank-box" style="margin-top:15px; text-align:left; background:#f9f9f9; padding:15px; border-radius:10px; font-size: 0.9em;">
            <div style="text-align:center; font-weight:bold; color: #555; margin-bottom: 8px;">🏆 全班前五名排行榜</div>
            <div id="rank-content">載入中...</div>
        </div>
        <button onclick="location.reload()" style="margin-top:20px; padding:10px 25px; border-radius:20px; border:none; background:var(--main); color:white; cursor:pointer;">重新測驗</button>
    </div>
</div>

<script>
    // --- 配置資料更新 ---
    const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCNHZ8u0345ZpgQJHZnqOxHHStz9S35BF3emJOzHV7yuIL0G55PPvz_i_fhAm4bu0iSTGCvbyzrr7T/pub?output=csv";
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScOCC3XH910Aj2izzG6Un-9P0y5g8KlbrCDxd1-LvsT1uSRow/formResponse";
    const ID_NO = "entry.380705505";
    const ID_SCORE = "entry.330260248";
    const RANK_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTFfKdDclmlrhFyAwjs7ck_rq4MTKxi6Ndf7TBeZoNcJD9O7zDlQ3_yuL7Y7Ii896p5TNxTRuIttP8R/pub?output=csv";

    let allQuestions = [];
    let gameQuestions = [];
    let currentIdx = 0, score = 0, timer, timeLeft = 30, currentCorrectValue = 0;

    function log(txt) { document.getElementById('debug-log').innerHTML += "<br>> " + txt; }

    const sel = document.getElementById('player-no');
    for(let i=1; i<=36; i++){
        let o = document.createElement('option'); o.value = i; o.textContent = i + " 號";
        sel.appendChild(o);
    }

    async function loadData() {
        try {
            const fetchUrl = SHEET_CSV.includes('?') ? `${SHEET_CSV}&t=${Date.now()}` : `${SHEET_CSV}?t=${Date.now()}`;
            const res = await fetch(fetchUrl);
            if (!res.ok) throw new Error("連線失敗 (HTTP " + res.status + ")");
            const text = await res.text();
            
            const lines = text.split(/\r?\n/);
            const temp = [];
            lines.forEach((line) => {
                // CSV 解析邏輯
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                if (cols.length >= 6 && ['1','2','3','4'].includes(cols[1])) {
                    temp.push({ q: cols[0], opts: [cols[2], cols[3], cols[4], cols[5]], a: parseInt(cols[1]) });
                }
            });

            if (temp.length === 0) {
                log("警告：讀取成功但解析題目為 0。請確認 CSV 格式是否正確。");
            } else {
                allQuestions = temp;
                document.getElementById('start-btn').disabled = false;
                document.getElementById('start-btn').innerText = "開始測驗";
                log("系統就緒！工作項目 04 共 " + allQuestions.length + " 題。");
            }
        } catch (e) {
            log("連線出錯：" + e.message);
        }
    }

    function initGame() {
        if(!sel.value) return;
        gameQuestions = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, 10);
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-area').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        if (currentIdx >= gameQuestions.length) { endGame(); return; }
        const data = gameQuestions[currentIdx];
        document.getElementById('q-count').innerText = `${currentIdx+1} / 10`;
        document.getElementById('q-text').innerText = (currentIdx+1) + ". " + data.q;
        currentCorrectValue = data.a;

        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach((btn, i) => {
            btn.innerText = "(" + (i + 1) + ") " + data.opts[i];
            btn.className = 'opt-btn';
            btn.disabled = false;
        });
        startTimer();
    }

    function startTimer() {
        timeLeft = 30;
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft -= 0.1; 
            let percent = (timeLeft / 30) * 100;
            document.getElementById('timer-fill').style.width = percent + "%";
            if (timeLeft <= 0) { clearInterval(timer); handleAnswer(-1); }
        }, 100);
    }

    function handleAnswer(val) {
        clearInterval(timer);
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.disabled = true);

        if (val === currentCorrectValue) {
            btns[val-1].classList.add('correct');
            score += 10 + Math.floor(timeLeft);
        } else {
            if (val !== -1) btns[val-1].classList.add('wrong');
            btns[currentCorrectValue-1].classList.add('correct');
        }
        document.getElementById('score-text').innerText = "得分: " + score;
        setTimeout(() => { currentIdx++; showQuestion(); }, 1200);
    }

    function endGame() {
        document.getElementById('quiz-area').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        
        // 提交成績到 Google Form
        fetch(`${FORM_URL}?${ID_NO}=${encodeURIComponent(sel.value)}&${ID_SCORE}=${score}&submit=Submit`, { mode: 'no-cors' });
        loadRank();
    }

    async function loadRank() {
        const content = document.getElementById('rank-content');
        try {
            const res = await fetch(RANK_CSV + (RANK_CSV.includes('?') ? '&' : '?') + "t=" + Date.now());
            const text = await res.text();
            const lines = text.split(/\r?\n/).slice(1);
            let data = lines.map(line => {
                const c = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(item => item.replace(/^"|"$/g, '').trim());
                return { n: c[1], s: parseInt(c[2]) || 0 };
            }).filter(i => i.n);
            data.sort((a, b) => b.s - a.s);
            content.innerHTML = data.slice(0, 5).map((it, i) => `
                <div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom: 1px dashed #ddd;">
                    <span>${i+1}. ${it.n} 號</span>
                    <span>${it.s} 分</span>
                </div>`).join('') || "尚無資料";
        } catch (e) { content.innerText = "排行榜同步中..."; }
    }

    window.onload = loadData;
</script>
</body>
</html>
